# ACT on the recorded task2 contract (20-dim action / 37-dim state).
# First training rung: cheap sanity — hours on the H100, beats zero-shot
# with a few dozen demos. Dataset repo_id/root are injected by
# camelo.train.train from --data.
policy:
  type: act
  chunk_size: 32
  n_action_steps: 16
  device: cuda
steps: 100000
batch_size: 8
save_freq: 10000
num_workers: 8
