# W5 rung: rate-matched ACT at 2.0 fps (every-15th-frame subsample of the
# untrimmed model16 corpus, outputs/datasets/ext_fixpos200_model16_2hz_v1).
# STEP-MATCHED CONTROL (2026-08-30, maintainer-requested): same as act_model16_2hz.yaml
# but at the baseline's 100000 gradient steps instead of the epoch-matched budget,
# to separate 'coarse data cannot teach the close' from 'undertrained' (GRASP_W5.md §5.2).
# Horizon: chunk_size 2 / 2.0 fps = 1.0 s (matches baseline's chunk_size 32
# / 30 fps = 1.067 s). Steps epoch-matched to act_model16.yaml's 4.60
# epochs (100000 steps x batch 8 / 173769 frames): 11681 kept frames (ceil
# per-episode len/15, 199 episodes) x 4.60 epochs / batch 8 = 6700 steps
# (raw 6722, rounded). n_action_steps is lerobot's replan horizon inside
# one model invocation; camelo's executor replans on its own
# --replan-steps schedule regardless. Date 2026-08-29.
policy:
  type: act
  chunk_size: 2
  n_action_steps: 1
  device: cuda
steps: 100000
batch_size: 8
save_freq: 10000
num_workers: 8
