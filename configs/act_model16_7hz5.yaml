# W5 rung: rate-matched ACT at 7.5 fps (every-4th-frame subsample of the
# untrimmed model16 corpus, outputs/datasets/ext_fixpos200_model16_7hz5_v1).
# Horizon: chunk_size 8 / 7.5 fps = 1.067 s (matches baseline's chunk_size
# 32 / 30 fps = 1.067 s). Steps epoch-matched to act_model16.yaml's 4.60
# epochs (100000 steps x batch 8 / 173769 frames): 43520 kept frames (ceil
# per-episode len/4, 199 episodes) x 4.60 epochs / batch 8 = 25000 steps
# (raw 25045, rounded). n_action_steps is lerobot's replan horizon inside
# one model invocation; camelo's executor replans on its own
# --replan-steps schedule regardless. Date 2026-08-29.
policy:
  type: act
  chunk_size: 8
  n_action_steps: 4
  device: cuda
steps: 25000
batch_size: 8
save_freq: 2500
num_workers: 8
