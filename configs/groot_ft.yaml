# Fine-tune GR00T N1.7 on recorded task2 data. Rung 3: 3B flow-matching VLA
# with dual-arm/humanoid pretraining.
#
# NOTE THE FORM: `type` + `pretrained_path`, NOT `policy.path`. NVIDIA's
# repos ship a config.json with no lerobot `type` field, so --policy.path
# cannot resolve them (F-26/F-41 — re-confirmed on this exact checkpoint:
# GR00T-N1.7-3B's config.json has no `type`).
#
# Why this rung is the plausible one for our 37-dim contract: GR00T declares
# max_state_dim/max_action_dim = 132, so the recorded 37-dim state and
# 20-dim action fit with room to spare — unlike the pi/smolVLA family, which
# caps at 32. Its I/O layers are embodiment-ID-indexed, and `new_embodiment`
# (the default tag) creates FRESH projectors sized to our dataset, which is
# precisely the adaptation path we want; tune_projector defaults true.
policy:
  type: groot
  base_model_path: nvidia/GR00T-N1.7-3B
  embodiment_tag: new_embodiment
  device: cuda
steps: 20000
batch_size: 8
save_freq: 2000
num_workers: 8

# F-66 fix (resolution, not the tokenizer gate): GR00T stacks every camera
# into one (B, T, V, H, W, C) tensor with NO resize step first
# (processor_groot.py:1855), and our streams are not uniform (head
# 1280x720, wrists 848x480). Re-encoding the dataset is NOT required —
# lerobot already resizes per-camera at the DATALOADER, before the stack,
# via dataset.image_transforms. `tfs` must be passed as a single JSON
# blob: draccus accepts whole-field JSON for `dict[str, ImageTransformConfig]`
# but rejects dotted paths into new dict keys (tested — `--....tfs.resize.type=`
# fails as an unrecognized argument). `max_num_transforms=1` with exactly one
# entry in `tfs` makes RandomSubsetApply's sampling-without-replacement always
# select it, so every frame is resized, not just some. 256x256 is arbitrary
# above the model's own working size (GrootConfig.image_size / N1_7 target
# 256x256, crop 230x230) since GrootN17VLMEncodeStep resizes+crops again
# downstream — this only needs to unblock np.stack.
dataset:
  image_transforms:
    enable: true
    max_num_transforms: 1
    tfs: '{"resize": {"weight": 1.0, "type": "Resize", "kwargs": {"size": [256, 256]}}}'
