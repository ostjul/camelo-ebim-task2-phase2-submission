# Fine-tune pi0.5 on recorded task2 data. Same rung as pi0_ft, preferred
# over it for one reason: it shares lineage with the `pi05droid` zero-shot
# rung, so fine-tuned-vs-zero-shot is a cleaner comparison (docs/runbooks/TRAINING.md).
# pi05_base's empty-stats problem only blocks zero-shot inference —
# fine-tuning computes normalization stats from our dataset.
#
# ⚠️ REQUIRES LoRA — a full fine-tune does not fit one H100 (F-65). 4.14B
# learnable params OOMs at batch 8 on 80 GB; with `--peft.method_type=LORA
# --peft.r=16 --batch_size=4` it trains in 34.1 GB at 19 samples/s.
#
# It DOES accept our recorded 37-dim state, unlike pi0: pi05 discretizes the
# state into its text prompt rather than pushing it through a fixed-width
# linear projection, so max_state_dim: 32 does not bind here (F-65).
policy:
  path: lerobot/pi05_base
  device: cuda
# Camera parity with eval, POSITIONAL — see docs/runbooks/TRAINING.md. Same keys as
# pi0_base; positional and semantic readings agree here, which is luck.
rename_map:
  observation.images.head: observation.images.base_0_rgb
  observation.images.wrist_left: observation.images.left_wrist_0_rgb
  observation.images.wrist_right: observation.images.right_wrist_0_rgb
steps: 20000
batch_size: 8
save_freq: 2000
num_workers: 8
