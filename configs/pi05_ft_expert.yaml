# pi0.5 fine-tune, experiment 2: full-rank training of the action expert.
#
# The pair to configs/pi05_ft_lora_v2.yaml. Same base, same corpus, same
# caption, same lr, same sample budget — the only difference is what is
# trainable. If a rank-decomposed residual on 14 M params is the thing
# limiting terminal precision, this run says so by beating it; if both
# land in the same place, the limit is upstream of the optimizer (data,
# camera resolution, action space) and the next move is the 16-dim
# relative-action rebuild, not more capacity.
#
# `train_expert_only: true` freezes ALL of PaliGemma — vision tower and
# language model both (`modeling_pi05.py:272-275`) — and leaves the
# gemma_expert plus the top-level projections trainable. Counted from the
# checkpoint's own tensors: **693.4 M trainable, 19.2 % of the 3.6 B
# model**. No `peft:` block, so lerobot skips the PEFT wrap entirely
# (`lerobot_train.py:331` keys off `cfg.peft is not None`) and these
# params train at full rank.
#
# ⚠️ This is NOT the configuration F-65 found to OOM. That measurement was
# a full fine-tune of everything — 4.14 B learnable at batch 8 on 80 GB.
# Freezing PaliGemma removes 2.92 B of that. Still: run `make train-smoke`
# on this config before booking hours, and read the reported memory.
#
# ⚠️ bfloat16 means the optimizer updates bf16 master weights (lerobot has
# no fp32 master copy; `dtype` casts the model and sets Accelerate's
# mixed_precision together). That is the upstream pi0.5 recipe and it is
# what makes batch 16 fit, but it is also the one place this run trades
# numerical headroom for throughput. If it underperforms the LoRA run in a
# way that looks like update noise rather than capacity, re-run at
# float32 + batch 8 before concluding anything about expert capacity.
policy:
  path: lerobot/pi05_base
  device: cuda
  dtype: bfloat16
  gradient_checkpointing: true
  train_expert_only: true
  # freeze_vision_encoder is deliberately omitted: train_expert_only
  # already freezes the vision tower as part of PaliGemma, and setting
  # both would imply the vision encoder is the interesting boundary here.
  scheduler_decay_steps: 69708
# Camera parity with eval, POSITIONAL — see docs/runbooks/TRAINING.md.
rename_map:
  observation.images.head: observation.images.base_0_rgb
  observation.images.wrist_left: observation.images.left_wrist_0_rgb
  observation.images.wrist_right: observation.images.right_wrist_0_rgb
# Same 8 epochs / ~1.12 M samples as the LoRA run, at half the batch:
# twice the optimizer steps for the same data. Raise batch_size to 32 and
# halve steps if the smoke run shows the memory headroom — but change
# both together, or the two experiments stop being comparable.
steps: 69708
batch_size: 16
save_freq: 8000
num_workers: 8
