# pi0.5 lora_v2, experiment 3: the SAME adapter fix, on the UNTRIMMED corpus.
#
# Identical to `configs/pi05_ft_lora_v2.yaml` in every trainable respect —
# same base, same LoRA rank/alpha/targets, same LR schedule, same sample
# budget. The ONLY difference is the dataset:
#
#   lora_v2           ext_fixpos200_trim_model16_v1   139 416 frames
#   this file         ext_fixpos200_model16_v1        173 769 frames
#
# so the pair is a one-variable test of whether trimming the spine ramp
# helps or hurts. Pass the corpus with DATA=, it is not named here.
#
# ## Why run it
#
# `trim_ramp` drops each episode's spine-ramp frames, and the arm sits at
# the reset pose during that ramp. Measured on this box: 10.77 % of
# UNTRIMMED frames lie within 0.5 rad of the demos' own frame-0 pose
# against **0.000 %** of trimmed ones, and the trim cut exceeds the frame
# at which the arm departs in 199/199 episodes. A trimmed-corpus rung
# therefore meets an out-of-distribution state at t=0. Probed offline
# (job 3828260), smolVLA — trimmed — degrades 5.75x on arm error and
# 17.6x on executor demand at pre-ramp frames, while ACT — trained on the
# untrimmed corpus — is flat at 0.67x/1.16x with a deterministic 0.000
# sampling spread. Two architectures, splitting on corpus rather than
# on model family.
#
# ## What it will NOT fix, so read the result carefully
#
# The eval reset condition is arm-at-ready AND spine-at-plateau. That
# combination occurs in **0 of 173 769** untrimmed frames: the operator
# always began reaching (frame ~94) before the spine settled (frame ~157),
# in 197/199 episodes. So this corpus contains the reset POSE but never
# the reset CONDITION. It is a recording-protocol gap that the trim
# amplifies, not one the trim created, and untrimming narrows it rather
# than closing it. Expect improvement, not a fix; the DGX side's
# start-pose fix likewise raised pad engagement without moving IoU off 0.0.
#
# ## Free repair of F-85
#
# Trimming is what COLLAPSED the spine quantiles: it removed the 0 -> 0.5
# sweep that spread action dim 19, leaving ~99 % of frames on a plateau so
# q01 and q99 landed on the same value and outliers normalized to ~1e7
# (pi0.5 is the only rung on QUANTILES, and sat at loss 2.6e11). The
# untrimmed corpus keeps the sweep: dim 19 measures q01 0.181 / q99 0.501,
# a 0.319 span. `dataset_stats.repair_degenerate_quantiles` is still wired
# into the conversion, but here it has nothing to repair.
#
# ## Sample budget, deliberately NOT epochs
#
# `steps` is held at the lora_v2 value so the two runs cost the same and
# differ in one variable. At batch 32 that is 1 115 328 samples = 6.42
# epochs over 173 769 frames, where lora_v2 got 7.99 over 139 416. If you
# would rather match EPOCHS than compute, use steps 43 442 (and set
# scheduler_decay_steps to match) — but then the comparison confounds
# corpus with training length.
policy:
  path: lerobot/pi05_base
  device: cuda
  # Casts the weights AND drives Accelerate's mixed_precision
  # (lerobot_train.py:246-259) — one flag, both halves.
  dtype: bfloat16
  gradient_checkpointing: true
  # Keep equal to `steps` — the baseline parked the LR at its floor for
  # the last 5k by leaving this at 30000 against 34854 steps.
  scheduler_decay_steps: 34854
# Camera parity with eval, POSITIONAL — see docs/runbooks/TRAINING.md.
rename_map:
  observation.images.head: observation.images.base_0_rgb
  observation.images.wrist_left: observation.images.left_wrist_0_rgb
  observation.images.wrist_right: observation.images.right_wrist_0_rgb
peft:
  method_type: LORA
  r: 32
  lora_alpha: 64  # 2r — never leave this None
  # PEFT re.fullmatch's this against every module path (tuners_utils.py:1927).
  # 130 modules / 14.1 M trainable. pi0.5's own default regex hits 38
  # modules / 1.3 M and names three pi0 modules that match NOTHING here.
  target_modules: '(.*\.gemma_expert\..*\.self_attn\.(q|k|v|o)_proj|.*\.gemma_expert\..*\.mlp\.(gate|up|down)_proj|model\.(action_in_proj|action_out_proj|time_mlp_in|time_mlp_out))'
steps: 34854
batch_size: 32
save_freq: 4000
num_workers: 8
