# Fine-tune pi0 on recorded task2 data. Headline rung: needs the H100
# (bf16, big batch memory); freeze the instruction string to match eval.
# steps/save_freq are sized for the ~20k-frame external corpus (21 kept
# fixpos episodes): 20k steps @ batch 8 ~= 8 epochs of full fine-tuning a
# 3B VLA — more memorizes. Select the checkpoint by `make eval`, not train
# loss, and scale steps with the corpus (docs/runbooks/TRAINING.md, config sizing).
policy:
  path: lerobot/pi0_base   # lerobot/pi0 is deprecated pre-0.6 format (F-21)
  device: cuda
# Camera parity with eval, POSITIONAL — see docs/runbooks/TRAINING.md. Here the
# positional order (head, wrist_left, wrist_right) and the semantic names
# agree, which is luck, not a rule: lerobot SKIPS its feature-consistency
# check whenever a rename_map is supplied, so a wrong map fails silently.
rename_map:
  observation.images.head: observation.images.base_0_rgb
  observation.images.wrist_left: observation.images.left_wrist_0_rgb
  observation.images.wrist_right: observation.images.right_wrist_0_rgb
steps: 20000
batch_size: 8
save_freq: 2000
num_workers: 8
