# EO-1 on the real-robot Munich corpus. Second wave -- DROID (Franka +
# Robotiq-class) is in its pretraining mixture, and it carries the
# strongest verbatim external number on the ladder ("Franka Pick-and-Place:
# 0.935" on the model card, docs/realdata/08_MODEL_SELECTION_AND_RIG_SCHEDULE.md
# §2.4). MIT licence -- the cleanest on the list.
#
# 27/15 fits under EO1Config's fixed max_state_dim=max_action_dim=32
# linear projection (NOT token-based -- an earlier survey doc's table
# claiming token-based was wrong, corrected in review).
#
# No rename_map, no camera-count trap: EO-1's Qwen2.5-VL backbone consumes
# a generic multi-image chat-style input, not fixed named slots like the
# pi family. All THREE cameras are used (verified: the preprocessor emits
# three image grids per sample, [1,16,30] head + [1,18,26] x2 wrists).
# ---------------------------------------------------------------------------
# UNBLOCKED 2026-08-31 (was BLOCKED by review B-1 / launch log §4 E-1).
# Every claim below was measured on the login node against the real
# artifact, not read off a doc.
#
# WHAT WAS WRONG. The rung pointed `vlm_base` at `IPEC-COMMUNITY/EO-1-3B`,
# the EO-1 authors' own HF checkpoint. That repo names every backbone
# tensor `vlm_backbone.model.layers.*` / `vlm_backbone.visual.*` while
# `Qwen2_5_VLForConditionalGeneration` expects `model.language_model.*` /
# `model.visual.*`, and its `_checkpoint_conversion_mapping` is empty -- so
# `from_pretrained` bound **0 of 836** tensors, warned, and returned a
# random 3.77 B model (F-81). Falling back to plain Qwen2.5-VL bound
# 824/824 but broke the token wiring: `<|state_pad|>` / `<|action_pad|>`
# live at 151669 / 151666 in EO-1's extended vocab and Qwen's stops at
# 151665. Smoke job 3983182 never reached step 1 anyway -- it died in the
# image processor (see FIX 2).
#
# WHAT FIXED IT. `lerobot/eo1-base` exists on the Hub: upstream's own
# LOSSLESS key-layout conversion of `IPEC-COMMUNITY/EO-1-3B` at the exact
# revision this project already had cached (fe0a015d...), 836 tensors
# already named for lerobot's `EO1Policy` module tree, shipping EO-1's
# extended tokenizer. It is consumed through `policy.path` (below), NOT
# through `vlm_base` -- so the Qwen backbone AND EO-1's flow-matching
# action head (state_proj, action_in_proj, action_out_proj.{0,2},
# action_time_mlp_{in,out}) both come from the checkpoint. NOTHING is
# freshly initialised: the 32-wide state/action projections are
# dimension-agnostic, so 27/15 needs no new module.
#
#   MEASURED, through the real lerobot load path, on CPU:
#     safetensors.load_model(EO1Policy(cfg), model.safetensors, strict=False)
#       -> missing_keys 0, unexpected_keys 0   (837th expected tensor is
#          vlm_backbone.lm_head.weight, tied to embed_tokens, not stored)
#     tokenizer: <|action_start|> 151665, <|action_pad|> 151666,
#       <|action_end|> 151667, <|state_start|> 151668, <|state_pad|> 151669,
#       <|state_end|> 151670, <|vla|> 151671  -- all seven RESOLVE
#     one real corpus batch (b=2, 3 cams, state 27, action 15) through
#       make_policy + make_pre_post_processors -> finite loss (0.85-1.19
#       over unseeded flow-matching draws)
#
# `policy.path` points at a DERIVED directory, not the hub id, for the
# same reason pi0_fast does (scripts/stage_assets.py:derive_pi0fast_base).
# Rebuild it with `python scripts/stage_assets.py --rung eo1`; the full
# rationale is in `scripts/stage_assets.py:derive_eo1_base` and in the
# CAMELO_README.md that function writes into the directory. Two files in
# it are real rather than symlinks back into the pristine HF cache:
#
#   FIX 1 -- config.json. `lerobot/eo1-base` was exported by a LATER
#     lerobot; six of its fields (flow_loss_weight, text_loss_weight,
#     tokenizer_max_length, use_language_recipe, recipe, recipe_path) do
#     not exist on 0.6.1's EO1Config and draccus rejects unknown keys
#     outright (`DecodingError`). They are dropped. None of the six has a
#     0.6.1 code path to configure, so this is a no-op, not a downgrade.
#     `vlm_base`/`pretrained_path` are repointed at the directory itself so
#     nothing reaches the hub from an offline compute node.
#
#   FIX 2 -- `use_fast_processor: true`, and it is NOT cosmetic. This is
#     what actually killed job 3983182:
#       TypeError: can't convert cuda:0 device type tensor to numpy
#       ... image_processing_pil_qwen2_vl.py -> image_processing_backends.py:458
#     `accelerator.prepare(dataloader)` hands the training loop batches
#     that are ALREADY on the GPU, and the PIL image-processor backend
#     calls `Tensor.numpy()` on them. The torchvision backend
#     (`use_fast_processor: true`) keeps the tensor a tensor and only
#     `.to(device)`s it. It must live in the ARTIFACT, not here: with a
#     `policy.path` the processor pipeline is rebuilt from the checkpoint's
#     own `policy_preprocessor.json` and `lerobot_train.py` overrides only
#     four step names, none of them the EO-1 steps (the same trap FIX 3 of
#     the vla_jepa rung documents).
#
#   ...and the same load path is why the checkpoint carries a GENERATED
#   `policy_preprocessor.json` at all: `lerobot/eo1-base` ships none, and
#   without one `make_pre_post_processors` raises ProcessorMigrationError.
#   `EO1ConversationTemplateStep` stores the visual feature keys in that
#   file and lerobot overrides no field of it, so the generated pipeline
#   names THIS corpus's three cameras and the derived directory is
#   CORPUS-SPECIFIC. Rebuild it if the corpus changes.
#
# gradient_checkpointing: true closes review item B-6, and B-6 is now
# CONFIRMED BY MEASUREMENT rather than by reasoning: the identical config
# with `--policy.gradient_checkpointing=false` (job 3986246) dies with
#   torch.OutOfMemoryError: ... 79.14 GiB in use of 79.17 GiB capacity
# before step 1. With it on, mem_gb is 36.27 of 80 -- so the headroom is
# real but it is bought by the flag, not spare.
#
# STEP COUNT AND SHAPE RE-DERIVED ON 4xH100 (launch agent, 2026-08-31).
#
# The 1-GPU derivation this block used to carry is preserved in
# docs/realdata/13_LAUNCH_LOG.md §1.3; it concluded 8,000 steps = 1.28
# epochs and flagged that only more GPUs move the ceiling. They do, and
# four of them were free:
#
#   MEASURED, 1xH100, batch 16, gradient checkpointing on
#     (smokes 3984855 / 3986305):  updt_s 5.73-6.63  data_s 0.020  mem 36.27
#   MEASURED, 4xH100, batch 4/rank = global 16, same config
#     (smoke 3986485):             updt_s 1.850      data_s 0.011  mem 43.19
#     wall clock between the step:25 and step:50 lines = 47 s / 25 steps
#     = **1.88 s/step** -- a 3.5x speedup on 4 GPUs, i.e. near-linear.
#
# That is a MEASURED 4-GPU number, not a 1x->4x projection. The distinction
# is not pedantry: the MolmoAct2 rung's M-2 update shows a 4-rank run whose
# data_s was 6.5 s against 0.21 s for the identical per-rank workload on one
# GPU, purely from OMP thread over-subscription. This rung's launcher
# carries the same `--num_cpu_threads_per_process=4` fix, and its data_s
# came back at 0.011 -- so the pathology is absent here, confirmed rather
# than assumed. EO-1 is compute-bound anyway (updt_s is 98% of the step).
#
# Fitting the ladder's 15% margin into launch.sh's 20:00:00 request
# (usable 0.85 x 20h x 3600 = 61,200 s), with evals capped at 512 samples
# (below) so they cost ~20 s rather than ~6 min each:
#     S = 61,200 / 1.88 = 32,500  ->  30,000 steps
#   30,000 x 1.88 = 15.7 h of training; 18.0 h with the margin; 20:00:00
#   requested, still four hours under the 24 h cliff.
#
# 30,000 x 16 / 99,654 = **4.82 epochs**, which puts this rung level with
# vla_jepa (4.82) and pi05_lora_15k (4.82) instead of the 1.28 the 1-GPU
# budget allowed. The global batch is UNCHANGED at 16 -- 4 per rank x 4
# ranks -- so this is the same optimisation problem the 1-GPU smokes
# measured, just faster.
#
# scheduler_decay_steps is now set EXPLICITLY to 30,000. It happens to
# equal EO1Config's own default, but leaving it implicit was only correct
# while `steps` also happened to be 30,000; at steps=8000 lerobot would
# have auto-scaled it (optim/schedulers.py:155) and the yaml would not have
# said so.
#
# save_freq: 7500, deliberately NOT the ladder's steps/12. An EO-1
# checkpoint measures **22 GB** (7.1 GB weights + 15 GB AdamW state,
# measured on job 3986305's own 000150), so steps/12 would write 264 GB.
# `checkquota` at 14:24 puts the shared /scratch/gpfs/FHEIDE fileset at
# 39.3 TiB of 40 TiB -- ~717 GB free for ALL FHEIDE users, with ~350 GB of
# that already spoken for by the running GR00T (24 GB x 12) and VLA-JEPA
# (17 GB x 12) rungs. 30,000/7500 = four saves = 88 GB. That costs nothing
# for selection, which is the DGX offline probe on the final checkpoint,
# not a loss ladder (repo MEMORY: "the final checkpoint plus small
# supporting files, not a ladder; disk is shared"). Full accounting in
# 13_LAUNCH_LOG.md §6b.
#
# Normalization/trainable specifics beyond dims/horizon are UNDERSPECIFIED
# in docs/realdata/00-08 for this corpus -- left at the checkpoint's own
# values (MEAN_STD state+action, full fine-tune, no PEFT), which match
# EO1Config's defaults. scheduler_decay_steps (30,000) already matches the
# step count below, so no override is needed.
policy:
  path: outputs/checkpoints/eo1_3b_lerobot
  device: cuda
  push_to_hub: false
  chunk_size: 8
  n_action_steps: 8
  gradient_checkpointing: true
  scheduler_decay_steps: 30000
tolerance_s: 1.01
dataset:
  video_backend: pyav
  eval_split: 0.1
# eval_steps: the eval PASS is kept (unlike GR00T/diffusion/VLA-JEPA, which
# had to switch it off) -- EO-1 tokenizes each camera independently at its
# own resolution instead of np.stack-ing them, so the eval dataset's
# untransformed 720x1280 + 480x640 frames are fine. Demonstrated, not
# assumed: the CPU forward pass above ran exactly that mixture in one batch.
# Widened 1000 -> 2500 to buy back walltime, not because it fails.
#
# max_eval_samples: 512 is the other half of that, and it closes a trap the
# MolmoAct2 pass surfaced (M-2 update): lerobot 0.6.1 builds the eval
# `Subset` at lerobot_train.py:515 ONLY when max_eval_samples > 0, so at the
# default of 0 every eval pass walks the ENTIRE 10,522-frame split. At this
# rung's rate that is ~6 min per pass even sharded over four ranks, x 12
# passes = ~1.2 h of a 20 h request spent on a number that is explicitly not
# a selection signal. Capped at 512 it is ~20 s. Same value MolmoAct2 uses.
eval_steps: 2500
max_eval_samples: 512
steps: 30000
batch_size: 4   # PER PROCESS -- 4 ranks x 4 = global 16, the shape both smokes measured
save_freq: 7500
num_workers: 8
