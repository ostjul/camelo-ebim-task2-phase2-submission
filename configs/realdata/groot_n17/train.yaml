# GR00T N1.7 on the real-robot Munich corpus. Second wave, step-cut to fit
# the 24 h hard cliff (docs/realdata/08_MODEL_SELECTION_AND_RIG_SCHEDULE.md
# "the four live findings" #2: a job requesting 24:00:00 starts now; one
# requesting a second more starts nine days out, past the rig window).
#
# STEP-COUNT DERIVATION -- RE-DERIVED FROM THE MEASURED RATE (2026-08-31,
# smoke job 3983181, 300 steps, 1xH100, 8 CPUs). The 20,000 below was
# provisional, cut against an UNMEASURED 1.5-3.0 s/step ESTIMATE band. The
# smoke measured, stable over steps 100-300:
#     updt_s 0.394   data_s 0.513   -> 0.907 s/step wall
#     smp/s 35 at batch_size 32     -> 0.914 s/step, agrees
#     mem_gb 36.20 (fits 80 GB with room)
# That is 1.7-3.3x FASTER than the estimate band's floor. Re-running the
# task's own rule, steps = 0.85 * 22h*3600 / s_per_step (22:00:00 is this
# rung's requested walltime, itself a margin under the 24 h cliff):
#     0.914 s/step -> 73,700 steps
# 30,000 steps costs 30,000 x 0.914 = 7.6 h of training; with the 15% margin
# 8.8 h -- 40% of the 22 h request. So the protocol's original 30,000
# (00_PROTOCOL.md §2.0 recipe table) is restored, and it is not close to the
# cliff. Kept at 30,000 rather than pushed higher because 30,000 is the
# number the protocol specifies; the extra headroom is margin, not budget.
# (The smoke ran with 8 CPUs; the long run gets 16, so data_s -- 56% of the
# step time here -- should fall, making this estimate conservative.)
# save_freq = 30000/12 = 2500, the ladder's shared convention.
#
# base_model_path MUST be a LOCAL DIRECTORY, never the hub id -- a hub id
# silently sets state_dropout_prob=0.0 (should be 0.2) and disables image
# augmentation (docs/realdata/00_PROTOCOL.md step 1.2). Stage first:
#   huggingface-cli download nvidia/GR00T-N1.7-3B \
#     --local-dir /scratch/gpfs/FHEIDE/JOST/models/GR00T-N1.7-3B
#
# policy.max_steps MUST equal steps (top-level) below -- it is a
# deprecated field wired ONLY into the warmup calculation
# (warmup = ceil(max_steps * warmup_ratio)); leaving it at its 10,000
# default parks warmup at 500 instead of the intended ~1,000.
#
# No rename_map: pretrained_path stays None on the base_model_path route
# (rename_map requires a pretrained --policy.path checkpoint --
# lerobot/configs/train.py:247-251), so a rename_map here would raise.
# The dataset.image_transforms Resize block exists ONLY to give
# np.stack() a uniform (B,T,V,H,W,C) tensor across cameras of different
# native resolutions -- it is NOT a manually-imposed letterbox on top of
# GR00T's own image pipeline, which keeps its shipped default (squash to
# 256^2, letter_box_transform=False) per U11.
#
# eval_steps: 0 -- DELIBERATE, and the only config on the ladder that
# deviates from the shared `eval_steps: 1000` convention. Reason (found
# 2026-08-31 at launch, from the diffusion smoke's failure; source-verified,
# not inferred from a crash):
#   * GR00T's processor stacks the cameras with
#     `np.stack(cams, axis=2)  # (B, T, V, H, W, C)`
#     (policies/groot/processor_groot.py:1855), which REQUIRES every camera
#     to have the same H,W. Ours do not -- head (3,720,1280), wrists
#     (3,480,640) (00_PROTOCOL.md D4). The `dataset.image_transforms` Resize
#     above is what makes them uniform.
#   * But `datasets/factory.py:188-209` builds the TRAIN dataset with those
#     transforms and the EVAL dataset with `image_transforms=None`. So the
#     eval pass would feed raw, mismatched frames straight into that
#     np.stack and raise -- at step 1000, ~40 minutes into a 22-hour job,
#     after the 300-step smoke had already passed. (The smoke cannot see it:
#     eval_steps=1000 > 300 steps.)
#   * `dataset.eval_split: 0.0` would also silence it, but that is the WRONG
#     fix: it would hand GR00T 195 training episodes where every other rung
#     trains on 175, a corpus confound. eval_split stays 0.1, the split stays
#     identical to every other rung, and only the eval PASS is skipped.
# Cost of the deviation: no eval_loss curve for this rung. That costs
# nothing for selection -- selection is the M1 gripper-close timing verdict
# on held-out episodes (00_PROTOCOL.md §5.2), and training/eval loss is
# explicitly not a selection signal in this project.
policy:
  type: groot
  base_model_path: /scratch/gpfs/FHEIDE/JOST/models/GR00T-N1.7-3B
  embodiment_tag: new_embodiment
  device: cuda
  push_to_hub: false
  chunk_size: 40
  n_action_steps: 8
  use_relative_actions: false
  tune_llm: false
  tune_visual: false
  tune_projector: true
  tune_diffusion_model: true
  tune_vlln: true
  tune_top_llm_layers: 0
  max_steps: 30000
dataset:
  image_transforms:
    enable: true
    max_num_transforms: 1
    tfs: '{"resize": {"weight": 1.0, "type": "Resize", "kwargs": {"size": [256, 256]}}}'
  video_backend: pyav
  eval_split: 0.1
tolerance_s: 1.01
eval_steps: 0
steps: 30000
batch_size: 32
save_freq: 2500
num_workers: 8
