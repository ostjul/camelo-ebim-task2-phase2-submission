# MolmoAct2 2-GPU DDP rehearsal -- de-risks the DDP launcher path (the
# cluster's first-ever multi-GPU job) and the slurm/train.slurm A0
# --num_workers fix at negligible cost, before the real 4-GPU run
# (../molmoact2/) is queued into a volatile multi-hour wait
# (docs/realdata/00_PROTOCOL.md §7 U14: "the MolmoAct2 2-GPU rehearsal
# runs in parallel with the first wave, not gated behind it").
#
# Same policy block as ../molmoact2/train.yaml (see that file's comments
# for the checkpoint_path/image_keys/gripper/LoRA rationale) with two
# differences: batch_size=16 (global 32 / 2 GPUs, not 4) and steps=300 --
# this directory IS the rehearsal, not a scaled-down long run, so the
# step count is baked in rather than overridden at launch time.
policy:
  type: molmoact2
  checkpoint_path: allenai/MolmoAct2
  device: cuda
  push_to_hub: false
  chunk_size: 20
  n_action_steps: 20
  image_keys:
    - observation.images.head
    - observation.images.wrist_left
    - observation.images.wrist_right
  setup_type: "bimanual franka robotic arms"
  control_mode: "absolute joint pose"
  enable_lora_vlm: true
  enable_lora_action_expert: false
  gradient_checkpointing: true
  model_dtype: bfloat16
  scheduler_decay_steps: 25000
tolerance_s: 1.01
dataset:
  video_backend: pyav
  eval_split: 0.1
# eval_steps: 0 -- CHANGED from 50 on 2026-08-31 (13_LAUNCH_LOG.md "M-2
# update"). eval_steps: 50 is what made rehearsal 3983334 look like a
# throughput failure: `max_eval_samples` defaults to 0, and
# lerobot_train.py:515 only subsets the eval set when that is > 0, so the
# step-50 eval iterated the ENTIRE 10,522-frame held-out split -- measured
# ~21 min on one GPU at batch 8, and it also spawns a SECOND set of 16
# `spawn`-context workers per rank. With log_freq at its 200 default (the
# job's own printed cfg says 200, not the 50 the first write-up assumed)
# the 30-minute window ended before step 200 could ever be reached, and
# the run was read as ">= 38.6 s/step" when the real rate is 4.2 s/step at
# batch 16 on one H100. A 300-step rehearsal exists to measure the step
# rate; it must not evaluate at all. Same deviation groot_n17/ and
# diffusion/ make, for the same reason.
eval_steps: 0
log_freq: 25
steps: 300
batch_size: 16
save_freq: 300
num_workers: 8
