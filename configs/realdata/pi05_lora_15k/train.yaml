# pi0.5 LoRA v2 on the real-robot Munich corpus, 15,000-step budget --
# "the guaranteed deliverable" (docs/realdata/08_MODEL_SELECTION_AND_RIG_SCHEDULE.md
# §0/U10 schedule). Same LoRA recipe as configs/pi05_ft_lora_v2.yaml
# (the measured, audited one), pointed at the real corpus's 27/15 layout
# instead of the sim contract's 37/20.
#
# Peer config: ../pi05_lora_30k/train.yaml -- same policy block, different
# step budget/scheduler_decay_steps/save_freq. Do NOT read this run's
# step-15000 checkpoint as a substitute for a dedicated 30k run: at step
# 15000 of a 30k-step cosine the LR is mid-schedule, not annealed.
#
# Normalization: QUANTILES against the RECOMPUTED corpus stats (mandatory
# -- the shipped/default stats clip 40-55% of values, docs/realdata/00_PROTOCOL.md
# gate G3). QUANTILES is PI05Config's own default, matching the paper's
# own pretraining normalization (§IV-C).
#
# Gripper: no flip. State dim 14 is already an open fraction, so the state
# prefix and the action target point the same way.
#
# Cameras: rename_map to pi0.5's declared DROID slots. resize_with_pad_torch
# LETTERBOXES (never squashes) -- U11 kept this unchanged: it matches
# DROID's own [180,320,3] 16:9 -> 224x126 letterbox, which is what pi05_base
# was pretrained on.
policy:
  path: lerobot/pi05_base
  device: cuda
  push_to_hub: false
  dtype: bfloat16
  gradient_checkpointing: true
  chunk_size: 50
  n_action_steps: 50
  # Keep equal to steps below -- parks the LR at its floor for the tail
  # of the run rather than decaying past the end (same convention as
  # configs/pi05_ft_lora_v2.yaml).
  scheduler_decay_steps: 15000
rename_map:
  observation.images.head: observation.images.base_0_rgb
  observation.images.wrist_left: observation.images.left_wrist_0_rgb
  observation.images.wrist_right: observation.images.right_wrist_0_rgb
peft:
  method_type: LORA
  r: 32
  lora_alpha: 64  # 2r -- never leave this None, PEFT default alpha=8 halves every update
  target_modules: '(.*\.gemma_expert\..*\.self_attn\.(q|k|v|o)_proj|.*\.gemma_expert\..*\.mlp\.(gate|up|down)_proj|model\.(action_in_proj|action_out_proj|time_mlp_in|time_mlp_out))'
tolerance_s: 1.01
dataset:
  video_backend: pyav
  eval_split: 0.1
eval_steps: 1000
steps: 15000
batch_size: 32
save_freq: 1250
num_workers: 8
