# pi0.5 LoRA v2 on the real-robot Munich corpus, 30,000-step budget --
# "the better checkpoint if it lands" (docs/realdata/08_MODEL_SELECTION_AND_RIG_SCHEDULE.md
# §0/U10 schedule). Identical policy/peft block to ../pi05_lora_15k/train.yaml
# except steps/scheduler_decay_steps/save_freq -- see that file for the
# full rationale (LoRA recipe, normalization, gripper, cameras).
#
# Measured (sim corpus, job 3872346 median / job 3937047 full run):
# updt_s ~= 1.636-1.64 s/step at batch 32 bf16 + gradient checkpointing,
# mem_gb ~= 20.2. 30,000 x 1.636 = 13.6 h.
policy:
  path: lerobot/pi05_base
  device: cuda
  push_to_hub: false
  dtype: bfloat16
  gradient_checkpointing: true
  chunk_size: 50
  n_action_steps: 50
  scheduler_decay_steps: 30000
rename_map:
  observation.images.head: observation.images.base_0_rgb
  observation.images.wrist_left: observation.images.left_wrist_0_rgb
  observation.images.wrist_right: observation.images.right_wrist_0_rgb
peft:
  method_type: LORA
  r: 32
  lora_alpha: 64
  target_modules: '(.*\.gemma_expert\..*\.self_attn\.(q|k|v|o)_proj|.*\.gemma_expert\..*\.mlp\.(gate|up|down)_proj|model\.(action_in_proj|action_out_proj|time_mlp_in|time_mlp_out))'
tolerance_s: 1.01
dataset:
  video_backend: pyav
  eval_split: 0.1
eval_steps: 1000
steps: 30000
batch_size: 32
save_freq: 2500
num_workers: 8
