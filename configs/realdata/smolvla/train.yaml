# SmolVLA on the real-robot Munich corpus. Opportunistic -- far OOD from
# SmolVLA's SO-100/SO-101 single-arm hobby-servo pretraining on every axis
# (no internal baseline of any kind exists for this rung), and the worst
# executor-ceiling ratio measured in the program when previously
# zero-shot'd (docs/realdata/08_MODEL_SELECTION_AND_RIG_SCHEDULE.md
# §0/§2.4).
#
# policy.path points at a REBUILT base
# (outputs/checkpoints/smolvla_base_state27, already built in this repo),
# not the raw lerobot/smolvla_base hub id. F-77: smolvla_base declares a
# 6-dim observation.state (SO-100) but its projection is 32-wide and
# prepare_state PADS rather than slices -- training on the stock base
# would already consume all 27 of our proprio dims (loss/grad-norm are
# bit-identical either way), but the FINE-TUNED checkpoint would INHERIT
# the stale [6] declaration and eval would then refuse to load it
# (pack_state, F-45). The rebuild is metadata-only:
#   python scripts/make_state_relabelled_base.py lerobot/smolvla_base 27 \
#       --output outputs/checkpoints/smolvla_base_state27
#
# load_vlm_weights defaults to False (meant for training the expert from
# scratch) and MUST be set True here to actually init from the pretrained
# SmolVLA weights rather than a randomly-initialised VLM.
policy:
  path: outputs/checkpoints/smolvla_base_state27
  device: cuda
  push_to_hub: false
  chunk_size: 50
  n_action_steps: 50
  load_vlm_weights: true
  # scheduler_decay_steps MUST equal `steps` below (added 2026-08-31 at
  # launch, review item 3). SmolVLAConfig's default is 30,000; leaving it
  # there against steps: 40000 would drive the cosine-decay schedule to its
  # floor at step 30,000 and then train the last 10,000 steps at the decay
  # LR -- the same steps/decay mismatch every other rung on this ladder sets
  # explicitly (pi05 15,000/30,000, pi0_fast 25,000, molmoact2 25,000).
  scheduler_decay_steps: 40000
# Camera slots are generic (camera1..3) -- ONLY the positional convention
# gives them meaning. lerobot SKIPS its feature-consistency check whenever
# a rename_map is supplied, so a wrong map fails silently.
rename_map:
  observation.images.head: observation.images.camera1
  observation.images.wrist_left: observation.images.camera2
  observation.images.wrist_right: observation.images.camera3
tolerance_s: 1.01
dataset:
  video_backend: pyav
  eval_split: 0.1
eval_steps: 1000
steps: 40000
batch_size: 16
save_freq: 3333
num_workers: 8
