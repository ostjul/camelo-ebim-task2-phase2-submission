# VLA-JEPA on the real-robot Munich corpus. Second wave -- launched in
# Phase A, evaluated in the rig window's second half
# (docs/realdata/08_MODEL_SELECTION_AND_RIG_SCHEDULE.md §0). The closest
# hardware match on the whole ladder: the paper's own real-robot setup is
# Franka Research 3 + Robotiq 2F-85 + 3 RealSense D435 + 100 demos / 3
# pick-and-place tasks [08 §2.4, W-verified].
#
# CAVEAT (flagged, not resolved -- see README): the RELEASED checkpoint's
# own config.json declares only TWO image inputs (exterior_1_left,
# exterior_2_left) and action(7,) -- no wrist camera. The paper's 3-camera
# match is the paper's *fine-tune* setup, not this artifact. No rename_map
# is applied here (see README for why) -- if training errors on an
# image-feature-count mismatch against the checkpoint, that is this
# assumption failing and needs revisiting before the smoke is trusted.
#
# reinit_modules re-initialises ONLY the named module prefixes so the
# policy can take our 27/15 dims instead of the checkpoint's native 8/7 --
# the model's own stated cross-embodiment mechanism [06 §4]. The two
# prefixes below are this policy's own docstring example
# (configuration_vla_jepa.py), not independently verified against the
# real module tree -- confirm at smoke time that state_dim/action_dim
# come out 8->27 / 7->15 and not silently truncated.
#
# reinit_modules is written as a JSON-STRING, not a YAML list: camelo's
# flatten() stringifies a real list value with Python repr (single
# quotes), which draccus's list[str] decoder rejects
# (DecodingError -- caught by this task's own parse-check). A JSON-array
# string is what draccus actually expects on the CLI, the same
# convention the GR00T config already uses for dataset.image_transforms.tfs.
# ---------------------------------------------------------------------------
# THREE LAUNCH-TIME FIXES (2026-08-31), all three verified by loading the real
# checkpoint on CPU on the login node, not by reading docs. Smoke job 3983180
# FAILED on the first of them.
#
# FIX 1 -- reinit_modules was missing `model.action_model.action_decoder`.
#   The 300-step smoke died before step 0 with
#     ValueError: Shape mismatch for
#     'model.action_model.action_decoder.layer2.bias'
#     (checkpoint (7,) vs model (15,)) and its prefix is not in `reinit_modules`.
#   Enumerating the staged `model.safetensors` (1,617 tensors) gives EXACTLY
#   four dim-dependent tensors, and now all four are covered:
#     model.action_model.action_encoder.layer1.weight  [768, 7]   -> (768, 15)
#     model.action_model.state_encoder.layer1.weight   [1024, 8]  -> (1024, 27)
#     model.action_model.action_decoder.layer2.weight  [7, 1024]  -> (15, 1024)
#     model.action_model.action_decoder.layer2.bias    [7]        -> (15,)
#   The header's original claim -- that the two-prefix list was "this policy's
#   own docstring example, not independently verified against the real module
#   tree" -- was exactly right, and exactly what bit.
#
# FIX 2 -- rename_map, for the camera question this file previously only
#   flagged. It is not a risk, it is a certainty: the released checkpoint's
#   config.json declares TWO image inputs (exterior_1_left, exterior_2_left),
#   `make_policy` keeps a checkpoint's non-empty `input_features`
#   (policies/factory.py:305-306), and with no rename_map lerobot then runs
#   `validate_visual_features_consistency`, which raises `Feature mismatch`
#   because {exterior_1_left, exterior_2_left} and {head, wrist_left,
#   wrist_right} are neither equal nor subsets. Reproduced on CPU.
#   So this rung runs on TWO cameras, not three -- head into the checkpoint's
#   primary exterior slot, wrist_right into the second, wrist_left DROPPED.
#   wrist_right is the kept wrist because the task's acting arm is the right
#   one (action dims 7-14, including the only gripper channel the M1 probe
#   reads). Declaring all three via an `input_features` override was tried
#   and rejected: it builds, but it produces a FIVE-camera policy
#   (exterior_1_left, exterior_2_left, head, wrist_left, wrist_right) whose
#   first two keys are absent from every batch. That is the camera-count
#   deviation recorded for this rung -- it is the checkpoint's shape, and
#   the only alternative was to not run it.
#
# FIX 3 -- policy.path now points at a LOCAL staged copy with the two gripper
#   postprocessor steps removed. VLAJEPAConfig defaults are
#   `gripper_dim: 6`, `binarize_gripper_action: true`,
#   `pre_snap_gripper_action: true` (configuration_vla_jepa.py:89-93). Our
#   action index 6 is `left_follower_gello_joint_states_fr3_joint7` -- a LEFT
#   ARM JOINT. The gripper is index 14. Left as-is, every rollout would clamp
#   a left-arm joint to +/-1 (processor_vla_jepa.py:95) and leave the actual
#   gripper untouched, silently destroying the exact channel this project
#   selects on.
#   Setting `policy.gripper_dim: 14` / `binarize_gripper_action: false` here
#   does NOT work: with a `policy.path`, the postprocessor pipeline is
#   RECONSTRUCTED FROM the checkpoint's `policy_postprocessor.json`, whose
#   entries carry `"config": {}` -- so the steps come back with class
#   defaults, and `lerobot_train.py:357-386` overrides only four step names,
#   none of them these. The fix has to be in the artifact.
#   Staged with (reproducible; symlinks the 2.8 GB weights, copies nothing):
#     SRC=$(ls -d "$HF_HOME"/hub/models--lerobot--VLA-JEPA-Pretrain/snapshots/*/)
#     DST=outputs/checkpoints/vla_jepa_pretrain_nogripper
#     mkdir -p $DST
#     for f in config.json model.safetensors policy_preprocessor.json \
#              policy_preprocessor_step_3_normalizer_processor.safetensors \
#              policy_postprocessor_step_2_unnormalizer_processor.safetensors \
#              README.md; do
#         ln -sf "$(readlink -f "$SRC$f")" "$DST/$f"
#     done
#     # then drop the two gripper steps from policy_postprocessor.json:
#     #   before: clip_actions, pre_snap_gripper, unnormalizer,
#     #           binarize_gripper, device
#     #   after : clip_actions, unnormalizer, device
#   `state_file` in that JSON is referenced by literal filename, not by step
#   index, so removing steps does not break the unnormalizer's sidecar.
#   No binarization and no pre-snap is also the right recipe on the merits:
#   the action head is freshly re-initialised for 15 dims (FIX 1), so there is
#   no pretrained gripper convention to match, and our dim 14 is a continuous
#   open fraction in [0.202, 1.0] whose transition band IS the measurement.
#   Same call 00_PROTOCOL.md §2.3 makes for GR00T ("do not flip and do not
#   binarize").
# ---------------------------------------------------------------------------
policy:
  path: outputs/checkpoints/vla_jepa_pretrain_nogripper
  device: cuda
  push_to_hub: false
  chunk_size: 7
  n_action_steps: 7
  reinit_modules: '["model.action_model.action_encoder", "model.action_model.state_encoder", "model.action_model.action_decoder"]'
rename_map:
  observation.images.head: observation.images.exterior_1_left
  observation.images.wrist_right: observation.images.exterior_2_left
tolerance_s: 1.01
dataset:
  # FIX 4 (2026-08-31, smoke 3983302). Same failure as the diffusion rung and
  # the same underlying corpus fact: VLA-JEPA stacks its cameras into one
  # tensor before the encoder, so heterogeneous frames raise
  #   RuntimeError: stack expects each tensor to be equal size, but got
  #   [16, 8, 3, 720, 1280] at entry 0 and [16, 8, 3, 480, 640] at entry 1
  # (head vs wrist_right). 224x224 is not an arbitrary choice: it is exactly
  # what this checkpoint's own config.json declares for both of its image
  # inputs, so after this transform the real tensors and the declared
  # input_features agree instead of merely not being compared.
  # Verified on CPU that the transform is deterministic -- 20 draws of each
  # source shape all come out (3,224,224); `max_num_transforms: 1` over a
  # single weighted entry always selects it, it is not a random augmentation.
  image_transforms:
    enable: true
    max_num_transforms: 1
    tfs: '{"resize": {"weight": 1.0, "type": "Resize", "kwargs": {"size": [224, 224]}}}'
  video_backend: pyav
  eval_split: 0.1
# eval_steps: 0 -- forced by FIX 4, exactly as in diffusion/ and groot_n17/.
# datasets/factory.py:188-209 gives the TRAIN dataset the image_transforms
# above and the EVAL dataset `image_transforms=None`, so an eval pass would
# feed raw 720p/480p frames back into that same stack and raise -- at step
# 1000, hours into the run, after the 300-step smoke had gone green.
# eval_split stays 0.1 so this rung's 175/20 episode split is identical to
# every other rung's; only the eval PASS is skipped. Eval loss is not a
# selection signal here (00_PROTOCOL.md §5.2).
eval_steps: 0
steps: 30000
batch_size: 16
save_freq: 2500
num_workers: 8
