# GELLO arm teleoperation config for the TMR (Franka Mobile FR3 Duo).
#
# Derived from example_fr3_duo_config.yaml, adapted to this robot:
#   * arm_id "fr3v2" (not "fr3") - the TMR's arms are fr3v2, giving joint names
#     left_fr3v2_joint1..7 / right_fr3v2_joint1..7. franka_robot.xacro builds these
#     as ${arm_prefix}${robot_type}_jointN and fr3v2.urdf.xacro inserts the '_'
#     itself, so arm_prefix stays "left"/"right" with NO trailing underscore.
#   * The controller derives its interface prefix from its NODE NAMESPACE
#     (namespace "left" -> "left_"), so namespace must match arm_prefix. It also
#     subscribes to the relative topic "gello/joint_states", which resolves to
#     /left/gello/joint_states - matching franka_gello_state_publisher's output.
#   * load_gripper "false": the TMR uses Robotiq grippers, not the Franka Hand,
#     so joint_sources must not include franka_gripper/joint_states. Grippers are
#     driven separately via franka_gripper_manager's robotiq_gripper_client.
#
# Each entry starts its OWN controller_manager against that arm's FCI. This does
# NOT conflict with the mobile base: franka_bringup's tmrv0_2 ros2_control system
# ("TmrHardware") contains only the drive joints and cartesian velocity IO - its
# urdf is explicitly the "standalone, no arms" base variant.
#
# Usage (on the robot, tams_ws sourced):
#   ros2 launch franka_fr3_arm_controllers franka_fr3_arm_controllers.launch.py \
#     robot_config_file:=tmr_duo_config.yaml
#
# IP -> side, confirmed by the operator on 2026-08-02:
#     LEFT  = 172.16.16.12
#     RIGHT = 172.16.16.11
# NOTE this is the REVERSE of the upstream example_fr3_duo_config.yaml convention
# (which pairs left with .11). Do not "fix" it to match the template - a swap
# drives each GELLO arm onto the opposite robot arm.

# urdf_file is NOT used to locate the description: franka.launch.py builds the robot
# description from franka_bringup/urdf/franka_arm.urdf.xacro (which adds the ros2_control
# hardware interface) and selects the arm via arm_id -> robot_type. The key is kept only
# because franka_fr3_arm_controllers.launch.py reads it from every config entry.

# Single-arm variant of tmr_duo_config.yaml. Bring ONE arm up at a time when
# debugging: it halves the load (each arm runs its own 1 kHz controller_manager
# plus 1 kHz FCI, and this Jetson cannot lock memory for RT), and it lets you
# confirm the left/right mapping before two 7-DOF arms share a workspace.

RIGHT:
  arm_id: "fr3v2"
  arm_prefix: "right"
  fake_sensor_commands: "false"
  joint_sources: ["joint_states"]
  joint_state_rate: 50
  load_gripper: "false"
  namespace: "right"
  robot_ip: "172.16.16.11"
  urdf_file: "fr3v2/fr3v2.urdf.xacro"
  use_fake_hardware: "false"
  use_rviz: "false"
