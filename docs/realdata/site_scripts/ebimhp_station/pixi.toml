[workspace]
channels = ["https://prefix.dev/conda-forge", "https://prefix.dev/robostack-humble"]
name = "teleoperation-station"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Rebuild the station-side packages for THIS env, in its own build/install tree so it
# never collides with the Docker-container workspace (install/, Python 3.10) this host
# also has. Heavy robot-side packages (need libfranka, only run ON the robot) are
# deliberately excluded, same as the Docker workspace build did.
build-teleop = """colcon --log-base log_pixi build --symlink-install \
  --packages-up-to tmr_pedal_teleop pedal_state_publisher keyboard_state_publisher \
  franka_gello_state_publisher franka_gello_state_subscriber zed_open_capture_ros \
  --build-base build_pixi --install-base install_pixi \
  --cmake-args -DPython3_EXECUTABLE=$CONDA_PREFIX/bin/python3 \
               -DPython_EXECUTABLE=$CONDA_PREFIX/bin/python3"""

# Foot-pedal teleoperation on the host, against install_pixi/ and ROS_DOMAIN_ID 0.
[tasks.pedal]
cmd = "./start_pedal.bash"
env = { TMR_WS_INSTALL = "install_pixi", TMR_ROS_DOMAIN_ID = "0" }

# GELLO -> both arms + both grippers.
[tasks.gello]
cmd = "./start_gello.bash"
env = { TMR_WS_INSTALL = "install_pixi", TMR_ROS_DOMAIN_ID = "0" }

# Head (ZED) + both wrist (RealSense) cameras. Independent of gello/pedal.
[tasks.cameras]
cmd = "./start_cameras.bash"
env = { TMR_WS_INSTALL = "install_pixi", TMR_ROS_DOMAIN_ID = "0" }

# Everything, in the required order.
[tasks.teleop]
cmd = "./start_teleop.bash"
env = { TMR_WS_INSTALL = "install_pixi", TMR_ROS_DOMAIN_ID = "0" }

[dependencies]
ros-humble-desktop = ">=0.10.0,<0.11"
colcon-common-extensions = ">=0.3.0,<0.4"
cmake = ">=4.2.3,<5"
ninja = ">=1.13.2,<2"
pkg-config = ">=0.29.2,<0.30"
cxx-compiler = ">=2.0.0,<3"
evdev = ">=1.9.3,<2"
dynamixel-sdk = ">=4.0.5,<5"
ros-humble-rqt-image-view = ">=1.2.0,<2"
ros-humble-realsense2-camera = ">=4.55.0,<5"
ros-humble-cv-bridge = ">=3.2.0,<4"
libusb = ">=1.0.26,<2"
# Pinned: conda-forge's default empy (4.x) dropped the em.BUFFERED_OPT attribute rosidl's
# code generator (ROS Humble) still relies on - a newer empy silently breaks msg/action
# generation with "AttributeError: module 'em' has no attribute 'BUFFERED_OPT'".
empy = "3.3.4"
ros-humble-rosbag2-storage-mcap = ">=0.15.14,<0.16"
ros-humble-controller-manager-msgs = ">=2.51.0,<3"
websockets = ">=17.1,<18"
