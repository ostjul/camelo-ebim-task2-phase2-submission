[project]
name = "camelo-ebim"
version = "0.1.0"
description = "Camelo team participation stack for the EBiM benchmark: policy bridge, data collection, training"
readme = "README.md"
requires-python = ">=3.10"
# Core stays lightweight: importable on the GB10 (ROS), the H100 policy
# server (no ROS), and CI (neither). rclpy is intentionally NOT a
# dependency — it comes from the sourced ROS 2 environment (see
# docs/setup/SETUP.md: create venvs with --system-site-packages).
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "msgpack>=1.0",
    "websockets>=12.0",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
# Policy inference + fine-tuning. lerobot >= 0.6 ships GR00T N1.7, X-VLA
# and pi0 natively — the groot/xvla/pi extras pull their model deps
# (DGX_FINDINGS.md F-05). The optional Isaac-GR00T native stack
# (gr00t-isaac adapter, TensorRT) installs via docker/Dockerfile.policy.
policy = ["lerobot[groot,xvla,pi]>=0.6", "torch>=2.3"]
# Training box extras. num2words is an undeclared runtime dep of smolVLA's
# SmolVLM processor — lerobot[smolvla] does not pull it, and it fails at
# model construction, not import.
train = ["lerobot[groot,xvla,pi]>=0.6", "torch>=2.3", "wandb>=0.17", "num2words>=0.5"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["camelo"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
