# Teleoperation home pose - the agreed starting position for GELLO teleop.
#
# Written by gello_calibration_check.py --save-home. Each side records the ARM
# pose, the GELLO's RAW encoder values at that pose, and the calibration in force
# when it was captured.
#
# Why the raw values matter: assembly_offsets only mean something relative to a
# physical GELLO pose. Keeping the raw reading lets a later session reproduce the
# exact same calibration (--anchor from here), or detect that a GELLO has been
# knocked or re-assembled, instead of guessing what 'the usual pose' was.
#
# Check the current setup against this with:
#   gello_calibration_check.py --side <side> --check-home
