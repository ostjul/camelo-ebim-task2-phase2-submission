/**:
  ros__parameters:
    # -1 scans /dev/video0 through /dev/video63 for the first supported ZED camera.
    device_id: -1
    expected_serial_number: 10933668

    # VGA arrives as a 1344x376 side-by-side frame. Selecting one eye below
    # publishes a 672x376 image at 30 Hz - lower bandwidth than HD720 so the
    # camera can sustain 30 Hz.
    resolution: VGA
    fps: 30
    eye: left

    # Keep the existing LABS topic contract used by the UI and recorder.
    # This CPU pipeline currently publishes an unrectified eye image on the
    # compatibility topic.
    publish_topic: /head_camera/zed_node/rgb/color/rect/image
    frame_id: head_camera_left_optical_frame
